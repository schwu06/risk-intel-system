<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ page_title }} — {{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <span class="brand-title">{{ app_name }}</span>
      <span class="brand-sub">{% block brand_sub %}{{ page_subtitle }}{% endblock %}</span>
    </div>
    <nav class="main-nav" aria-label="主导航">
      <a href="/daily-news" class="nav-link {% if active_page == 'daily_news' %}active{% endif %}">风险日报</a>
      <a href="/entity-assessment" class="nav-link {% if active_page == 'entity_assessment' %}active{% endif %}">主体评估</a>
      <a href="/deep-reports" class="nav-link {% if active_page == 'deep_reports' %}active{% endif %}">深度研报</a>
    </nav>
    <div class="header-tools">
      {% block header_extra %}{% endblock %}
    </div>
  </header>

  <div class="app-shell" id="app-shell">
    {% include "partials/source_drawer.html" %}
    <div class="app-main">
      {% block content %}{% endblock %}
    </div>
  </div>

  <script src="/static/js/dashboard.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
