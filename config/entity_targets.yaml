# 主体评估的默认监控清单与可追溯公开信源。
# source_type: official | regulatory | exchange | industry | media
# relation: direct（主体本身）| contextual（行业/供应链背景，不触发主体预警）
entities:
  - key: Godiva
    display_name: 歌帝梵 Godiva
    aliases: [Godiva Chocolatier, GODIVA, 歌帝梵]
    industry: 消费品 / 巧克力
    region: 全球
    sources:
      - label: Godiva Media Center
        url: https://www.godiva.com/blogs/media
        source_type: official
        relation: direct
        priority: 40
        query: 'site:godiva.com/blogs/media (Godiva OR GODIVA) (press OR recall OR store OR partnership)'
      - label: Yıldız Holding Newsroom
        url: https://www.yildizholding.com.tr/en/press-room
        source_type: official
        relation: direct
        priority: 34
        query: 'site:yildizholding.com.tr (Godiva OR GODIVA) (news OR results OR debt OR strategy)'
      - label: 美国 FDA 召回与安全警报
        url: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts
        source_type: regulatory
        relation: direct
        priority: 38
        query: 'site:fda.gov (Godiva OR "Godiva Chocolatier") (recall OR warning OR safety)'
      - label: 国际可可组织 ICCO
        url: https://www.icco.org/statistics/
        source_type: industry
        relation: contextual
        priority: 24
        query: 'site:icco.org cocoa (market report OR supply OR price)'
      - label: 加纳可可局 COCOBOD
        url: https://cocobod.gh/news/
        source_type: industry
        relation: contextual
        priority: 22
        query: 'site:cocobod.gh cocoa (supply OR crop OR financing OR disease)'
      - label: 跨媒体主体检索
        url: https://news.google.com/
        source_type: media
        relation: direct
        priority: 30
        query: '(Godiva OR "Godiva Chocolatier" OR 歌帝梵) (earnings OR lawsuit OR recall OR debt OR store OR supply chain)'

